[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rs172"
dynamic = ["version"]
description = "Interface library and CLI for the RS PRO RS-172 (CEM DT-172) temperature/humidity data logger"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonas Hagen", email = "jonas.hagen@qrst.ch" }]
keywords = ["rs-172", "data logger", "temperature", "humidity", "serial", "cp210x", "dt-172", "dl-141th"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = ["pyserial>=3.5", "click>=8.1"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/jonas-hagen/RS-172_tool"
Source = "https://github.com/jonas-hagen/RS-172_tool"
Issues = "https://github.com/jonas-hagen/RS-172_tool/issues"
Documentation = "https://github.com/jonas-hagen/RS-172_tool/blob/main/docs/protocol.md"

[project.scripts]
rs172 = "rs172.cli:main"

[tool.hatch.version]
path = "src/rs172/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rs172"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs/protocol.md", "docs/rs-172.jpg", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
